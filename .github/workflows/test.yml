name: Tests

on:
  pull_request:
  push:
    # main is the only maintained branch. Keep this trigger aligned with the
    # protected default branch so retired aliases cannot hide CI drift.
    branches: [main]
  schedule:
    # Stagger sibling repositories so scheduled full matrices do not compete
    # for the same runner capacity at the top of the hour.
    - cron: "27 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@464468328f050e43299298fc0eac8b971ddd38b7
    with:
      # Signal and job-control behavior differs materially across GNU/Linux,
      # macOS Bash 3.2, and Termux. Run the full shared matrix on every PR so a
      # cleanup regression cannot wait for the scheduled compatibility run.
      matrix-set: full
      profiles: base,python,openssh-netcat-lsof,procps
      shellcheck-inventory-path: .github/shellcheck-files.txt
      test-command: ETTUN_SKIP_SHELLCHECK=1 test/run

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub resolves literal `uses:` refs before a job can read repository
      # files, so `.github/cgraf78-actions.lock` cannot be interpolated. This gate
      # verifies every unavoidable cgraf78/actions literal still matches that
      # single reviewed dependency decision.
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@464468328f050e43299298fc0eac8b971ddd38b7
