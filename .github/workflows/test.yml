name: Tests

on:
  pull_request:
  push:
    # main is the only maintained branch. Keep this trigger aligned with the
    # protected default branch so retired aliases cannot hide CI drift.
    branches: [main]
  schedule:
    # Stagger sibling repositories so scheduled full matrices do not compete
    # for the same runner capacity at the top of the hour.
    - cron: "27 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@6ecbf5dafaeb9483aeeba3915321544b31572172
    with:
      # Signal and job-control behavior differs materially across GNU/Linux,
      # macOS, and Termux. Run the full shared matrix on every PR so a cleanup
      # regression cannot wait for the scheduled compatibility run.
      matrix-set: full
      profiles: base,python,openssh-netcat-lsof,procps
      shellcheck-inventory-path: .github/shellcheck-files.txt
      test-command: ETTUN_SKIP_SHELLCHECK=1 test/run

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false

      # GitHub resolves literal `uses:` refs before a job can read repository
      # files, so `.github/cgraf78-actions.lock` cannot be interpolated. This gate
      # verifies every unavoidable cgraf78/actions literal still matches that
      # single reviewed dependency decision.
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@6ecbf5dafaeb9483aeeba3915321544b31572172

  namespace-self-connect:
    name: namespace self-connect regression
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false

      # The forced self-connect regression test narrows ip_local_port_range,
      # which needs CAP_NET_ADMIN: the container legs run without it, so the
      # test skips there. Run the suite in a fresh network namespace (root
      # via sudo: unprivileged user namespaces are blocked on the runner,
      # so `unshare -rn` fails writing uid_map), where the range is
      # writable, and require the coverage lines so a future skip fails
      # loudly instead of going green.
      - name: Run suite in a network namespace
        run: |
          set -euo pipefail
          sudo unshare -n bash -c 'ip link set lo up; ETTUN_SKIP_SHELLCHECK=1 test/run' 2>&1 | tee /tmp/ettun-namespace-test.log
      - name: Require the forced self-connect coverage
        run: |
          grep -q 'PASS: bind probe \[perl\]: forced self-connect is not a listener' /tmp/ettun-namespace-test.log
          grep -q 'PASS: bind probe \[perl\]: forced self-connect is reported as temporary' /tmp/ettun-namespace-test.log
